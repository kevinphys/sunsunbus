[project]
name = "sunsunbus-analysis"
version = "0.1.0"
description = "順順行 sunsunbus：公車加速度量測資料分析工具"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "folium>=0.17",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29"]

[project.scripts]
sunsunbus = "sunsunbus.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunsunbus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
